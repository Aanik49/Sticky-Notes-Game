<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Archival Cream Canvas & Mondrian Primary Blocks -->
  <rect x="4" y="4" width="120" height="120" fill="#F5F0E2" stroke="#111111" stroke-width="6" />
  <!-- Top-left Vermilion Red Block -->
  <rect x="7" y="7" width="38" height="38" fill="#D6302A" />
  <!-- Bottom-left Cobalt Blue Block -->
  <rect x="7" y="83" width="38" height="38" fill="#2B56A3" />
  <!-- Top-right Ochre Block -->
  <rect x="83" y="7" width="38" height="38" fill="#E4B43C" />
  <!-- Architectural Grid Lines -->
  <path d="M45 4V124M83 4V124M4 45H124M4 83H124" stroke="#111111" stroke-width="5" />

  <!-- Center Hero Bauhaus Ochre Sticky Note with Folded Corners & Red Block Arrow -->
  <g transform="translate(26 26)">
    <rect x="5" y="5" width="76" height="76" fill="#111111" />
    <path d="M0 0 H62 L76 14 V62 L62 76 H0 Z" fill="#E4B43C" stroke="#111111" stroke-width="4.5" stroke-linejoin="miter" />
    <!-- Top-right & Bottom-right Dog-Ear Corner Folds -->
    <path d="M62 0 V14 H76 Z" fill="#C99622" stroke="#111111" stroke-width="3.2" stroke-linejoin="round" />
    <path d="M62 76 V62 H76 Z" fill="#C99622" stroke="#111111" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Bold Black-Outlined Vermilion Block Arrow -->
    <path d="M16 32 H40 V21 L58 38 L40 55 V44 H16 Z" fill="#D6302A" stroke="#111111" stroke-width="3.5" stroke-linejoin="miter" />
  </g>
</svg>
