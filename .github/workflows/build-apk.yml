name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Sticky Notes Puzzle APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK (API 36)
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Decode release keystore (optional)
        id: keystore
        if: inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "SIGNING_KEYSTORE_PATH=$(pwd)/android/app/release.keystore" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK output
        id: apk
        run: |
          mkdir -p release-apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apk/sticky-notes-puzzle-release.apk
            echo "apk_path=release-apk/sticky-notes-puzzle-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=sticky-notes-puzzle-release" >> $GITHUB_OUTPUT
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apk/sticky-notes-puzzle-release-unsigned.apk
            echo "apk_path=release-apk/sticky-notes-puzzle-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "apk_name=sticky-notes-puzzle-release-unsigned" >> $GITHUB_OUTPUT
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/sticky-notes-puzzle-debug.apk
            echo "apk_path=release-apk/sticky-notes-puzzle-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=sticky-notes-puzzle-debug" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Attach APK to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
